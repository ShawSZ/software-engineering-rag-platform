# Windows single process: H2, local storage and Caffeine; no model needed to boot.
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/db/fast_knowledge;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: never
  flyway:
    locations: classpath:db/course-migration/h2
    baseline-on-migrate: false
    clean-disabled: true
    validate-on-migrate: true

knowledge:
  llm:
    provider: ${LLM_PROVIDER:deepseek}
    base-url: ${DEEPSEEK_API_URL:${LLM_BASE_URL:}}
    api-key: ${DEEPSEEK_API_KEY:${LLM_API_KEY:}}
    model: ${DEEPSEEK_MODEL:${LLM_MODEL:deepseek-flash}}
  cache:
    # 单实例进程内缓存（多实例部署请回到 redis）
    provider: ${CACHE_PROVIDER:caffeine}
  storage:
    # 文档落本地目录，无需 MinIO / OSS
    provider: ${STORAGE_PROVIDER:local}
  search:
    # Course keyword retrieval is implemented separately; do not start upstream vector retrieval.
    keyword-enabled: false
  index:
    pubsub-enabled: false
  wiki:
    enabled: false
    query-routing: false
  agentic:
    enabled: false
  query-rewrite:
    enabled: false
  vision:
    enabled: false
  image-gen:
    enabled: false
